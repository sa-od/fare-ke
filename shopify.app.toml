# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "afaa1818b41f7b8c26d66b8f709106de"
name = "fare-ke"
application_url = "https://fare-ke.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_inventory"

[auth]
redirect_urls = [ "https://fare-ke.vercel.app/api/auth" ]

# Per product: whether the paint colour picker is shown on this product.
[product.metafields.app.enabled]
type = "boolean"
name = "Paint picker enabled"
description = "Whether the paint colour picker shows on this product"

  [product.metafields.app.enabled.access]
  admin = "merchant_read"
  storefront = "public_read"

# Per product: this product's colours (JSON array of { code, hex, palette, tone, tier }).
[product.metafields.app.palette]
type = "json"
name = "Paint colours"
description = "This product's colour list used by the picker"

  [product.metafields.app.palette.access]
  admin = "merchant_read"
  storefront = "public_read"

# Per product: which variant option is the hidden tier (and which is the size),
# plus the mapping of base/light/medium/dark to this product's option values.
[product.metafields.app.variant_config]
type = "json"
name = "Tier variant config"
description = "Maps the picker tiers to this product's variant options"

  [product.metafields.app.variant_config.access]
  admin = "merchant_read"
  storefront = "public_read"
